version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: academichub-db
    environment:
      POSTGRES_DB: academichub_db
      POSTGRES_USER: hub_admin
      POSTGRES_PASSWORD: supersecureerppassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: always

  redis:
    image: redis:7-alpine
    container_name: academichub-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: academichub-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: rabbit_admin
      RABBITMQ_DEFAULT_PASS: supersecurerabbitpassword
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    restart: always

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: academichub-backend
    environment:
      PORT: 8080
      DATABASE_URL: postgres://hub_admin:supersecureerppassword@db:5432/academichub_db
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://rabbit_admin:supersecurerabbitpassword@rabbitmq:5672
      JWT_SECRET: enterprisejwtmastersecrettokenkey2026
    ports:
      - "8080:8080"
    depends_on:
      - db
      - redis
      - rabbitmq
    restart: always

  nginx:
    image: nginx:alpine
    container_name: academichub-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: always

volumes:
  pgdata:
  redisdata:
  rabbitdata:
